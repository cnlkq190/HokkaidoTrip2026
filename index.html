<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hokkaido Trip 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #f7f6f2;
      --card-bg: #ffffff;
      --text-main: #333d37;
      --text-sub: #7a8b7e;
      --accent-color: #6a7f70;
      --accent-light: #e8ebe6;
      --border-color: #eae8e1;
      --pending-bg: #fafaf8;
      --btn-bg: #f0f2ee;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 50px;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background-color: var(--bg-color);
      text-align: center;
      padding: 35px 20px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(10px);
      background-color: rgba(247, 246, 242, 0.9);
    }

    header .sub-title {
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: var(--text-sub);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 2px;
    }

    header h1 {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--text-main);
    }

    .tab-nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 15px 20px;
      position: sticky;
      top: 85px;
      z-index: 99;
      background-color: rgba(247, 246, 242, 0.95);
    }

    .tab-btn {
      flex: 1;
      max-width: 110px;
      padding: 8px 0;
      text-align: center;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }

    .tab-btn span {
      display: block;
      font-size: 0.7rem;
      opacity: 0.8;
    }

    .tab-btn.active {
      color: #fff;
      background-color: var(--accent-color);
      border-color: var(--accent-color);
      box-shadow: 0 4px 10px rgba(106, 127, 112, 0.25);
    }

    .schedule-container {
      max-width: 500px;
      margin: 10px auto 0;
      padding: 0 16px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .timeline-item {
      display: flex;
      align-items: flex-start;
      margin-bottom: 12px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      border: 1px solid rgba(234, 232, 225, 0.6);
    }

    .time-box {
      min-width: 72px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      color: var(--accent-color);
      font-size: 0.85rem;
      padding-right: 10px;
      margin-right: 12px;
      border-right: 1px solid var(--accent-light);
      letter-spacing: 0.5px;
    }

    .info-box {
      flex: 1;
    }

    .location-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      flex-wrap: wrap; /* ボタンが増えても折り返せるように */
      gap: 4px;
    }

    .location-name {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-main);
      letter-spacing: 0.2px;
    }

    .genre-icon {
      margin-right: 6px;
      font-size: 0.95rem;
    }

    /* リンクボタンのデザイン */
    .button-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .link-btn {
      text-decoration: none;
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 12px;
      background-color: var(--btn-bg);
      color: var(--accent-color);
      font-weight: 600;
      border: 1px solid var(--border-color);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .link-btn:active {
      background-color: var(--accent-color);
      color: #fff;
    }

    .description {
      font-size: 0.78rem;
      color: var(--text-sub);
      margin-top: 4px;
      font-weight: 300;
      line-height: 1.4;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <header>
    <div class="sub-title">Travel Schedule</div>
    <h1>Hokkaido 🌿 2026</h1>
  </header>

  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab(0)">Day 1<span>9/20 Sat</span></button>
    <button class="tab-btn" onclick="switchTab(1)">Day 2<span>9/21 Sun</span></button>
    <button class="tab-btn" onclick="switchTab(2)">Day 3<span>9/22 Mon</span></button>
  </div>

  <main class="schedule-container">
    <div id="day0" class="tab-content active"></div>
    <div id="day1" class="tab-content"></div>
    <div id="day2" class="tab-content"></div>
  </main>

  <script>
    fetch('./schedule.json')
      .then(response => response.json())
      .then(scheduleData => renderSchedule(scheduleData))
      .catch(error => console.error('Error loading schedule:', error));

    function renderSchedule(scheduleData) {
      Object.keys(scheduleData).forEach(dayIndex => {
        const container = document.getElementById(`day${dayIndex}`);
        const items = scheduleData[dayIndex];
        
        let html = '';
        items.forEach(item => {
          let buttonsHtml = '';
          // map, hp, ticket のいずれかがある場合にボタンを生成
          if (item.map || item.hp || item.ticket) {
            buttonsHtml += '<div class="button-group">';
            if (item.map) {
              buttonsHtml += `<a href="${item.map}" target="_blank" rel="noopener" class="link-btn">地図</a>`;
            }
            if (item.hp) {
              buttonsHtml += `<a href="${item.hp}" target="_blank" rel="noopener" class="link-btn">HP</a>`;
            }
            if (item.ticket) {
              buttonsHtml += `<a href="${item.ticket}" target="_blank" rel="noopener" class="link-btn">チケット</a>`;
            }
            buttonsHtml += '</div>';
          }
          
          html += `
            <div class="timeline-item">
              <div class="time-box">${item.time}</div>
              <div class="info-box">
                <div class="location-header">
                  <div class="location-name">
                    <span class="genre-icon">${item.genre || ''}</span>${item.location}
                  </div>
                  ${buttonsHtml}
                </div>
                <div class="description">${item.desc || ''}</div>
              </div>
            </div>
          `;
        });
        container.innerHTML = html;
      });
    }

    function switchTab(index) {
      const buttons = document.querySelectorAll('.tab-btn');
      const contents = document.querySelectorAll('.tab-content');

      buttons.forEach((btn, idx) => {
        btn.classList.toggle('active', idx === index);
      });

      contents.forEach((content, idx) => {
        content.classList.toggle('active', idx === index);
      });
    }
  </script>
</body>
</html>
